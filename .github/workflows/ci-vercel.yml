name: SL.STUDIO CI and Vercel Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slstudio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build, and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build when Vercel deployment is unavailable
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           (github.event.pull_request.head.repo.full_name != github.repository ||
            github.actor == 'dependabot[bot]'))
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 32100 --strictPort > /tmp/slstudio-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:32100/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/slstudio-vite.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:32100/ > /dev/null
          DYAD_TEST_BASE_URL=http://127.0.0.1:32100 npm run test

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-preview:
    name: Deploy Vercel preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: slstudio-vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: 1
      DEPLOY_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@60.0.1

      - name: Link Vercel project
        run: vercel link --yes --token="$VERCEL_TOKEN"

      - name: Pull preview environment and project settings
        run: vercel pull --yes --environment=preview --git-branch="$DEPLOY_BRANCH" --token="$VERCEL_TOKEN"

      - name: Build Vercel preview artifact
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
            --meta="githubDeployment=1" \
            --meta="githubCommitRef=$DEPLOY_BRANCH")"
          echo "Preview deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy Vercel production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@60.0.1

      - name: Link Vercel project
        run: vercel link --yes --token="$VERCEL_TOKEN"

      - name: Pull production environment and project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
