name: Build & Release SL.STUDIO

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web App
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-windows-native:
    name: Build Windows Native App (SLSTUDIO.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows Single-File Binary
        run: |
          dotnet publish native/DJSetRecorder/SL.STUDIO.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/windows-x64

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/windows-x64/SLSTUDIO.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SLSTUDIO.exe" | Set-Content dist/windows-x64/SLSTUDIO.exe.sha256 -NoNewline

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: slstudio-windows-x64
          path: dist/windows-x64/SLSTUDIO.exe*

  create-github-release:
    name: Create GitHub Release
    needs: [build-web, build-windows-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source and release notes
        uses: actions/checkout@v4

      - name: Verify versioned release notes exist
        shell: bash
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: slstudio-windows-x64
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SLSTUDIO.exe
            release-assets/SLSTUDIO.exe.sha256
          fail_on_unmatched_files: true
          name: SL.STUDIO ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: false
